# P0-2 复现场景配置：与 web-minimal 一致的最小可装配配置。
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

fastddd:
  web:
    openapi:
      enabled: false
    knife4j:
      enabled: false

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
