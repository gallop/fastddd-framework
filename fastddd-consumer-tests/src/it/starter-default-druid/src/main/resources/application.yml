# ECO-006C4 starter-default-druid 消费者配置：聚合 starter + 数据库（H2 内存库）。
# 不配置任何连接池类型：验证 fast-ddd-starter 聚合默认池仍为 Druid。
spring:
  datasource:
    url: jdbc:h2:mem:c4starterdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

# 关闭非必要 Web 表面，缩小启动失败面
fastddd:
  web:
    openapi:
      enabled: false
    knife4j:
      enabled: false

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
