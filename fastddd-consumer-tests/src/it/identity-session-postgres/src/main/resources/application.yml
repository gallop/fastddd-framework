# W2-1 C 模式消费者：identity 接管安全装配，双开关显式关闭（§4.3 条 2）。
# DataSource/ExternalLoginProvider 均由测试夹具提供（zonky PG + 桩提供者），见测试源码。
fastddd:
  identity:
    enabled: true
    login:
      mode: feishu-web
    pg:
      # 空库自动迁移（identity 主体/绑定/会话表）
      initialize-schema: true
      # W21-04：业务 @AuditLog 审计贯通（消费者真实业务路径验证用）
      ensure-audit-table: true
    audit:
      # W21-04：actor 扩展列模式（writer② 旧列 + actor 列）
      actor-columns: true
  security:
    jwt:
      enabled: false
    local-auth:
      enabled: false
