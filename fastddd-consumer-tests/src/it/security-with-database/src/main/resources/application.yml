# ECO-006C2 Security 有数据库消费者（H2 兼容回归配置，非真实 MySQL 证据）。
spring:
  datasource:
    url: jdbc:h2:mem:auditdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
fastddd:
  security:
    jwt:
      # 测试密钥（≥64 字节，仅消费者 harness 使用）
      secret: "fastddd-consumer-withdb-test-secret-please-not-use-in-production-00000000000"
