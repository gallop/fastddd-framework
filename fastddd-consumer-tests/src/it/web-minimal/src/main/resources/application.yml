# FRM-002 web-minimal 消费者配置：最小可启动。
# 聚合 starter 显式含 Druid（ECO-006C4）；crud 传递 MP 能力，有库路径需提供 DataSource。
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

# 关闭非必要 Web 表面，缩小启动失败面
fastddd:
  web:
    openapi:
      enabled: false
    knife4j:
      enabled: false

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
