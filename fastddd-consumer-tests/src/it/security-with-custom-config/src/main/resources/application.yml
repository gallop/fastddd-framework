spring:
  application.name: security-custom-config
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate.ddl-auto: none

fastddd:
  web.response-wrapper.enabled: true
  jackson.enabled: true
  security.jwt.secret: "fastddd-consumer-test-jwt-secret-key-with-at-least-64-bytes-for-hs512-signing-2026"
