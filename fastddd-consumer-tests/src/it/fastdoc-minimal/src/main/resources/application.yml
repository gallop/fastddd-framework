# SPLIT-002 fastdoc-minimal 消费者配置：H2 内存库为 FastDocService 提供 DataSource。
spring:
  datasource:
    url: jdbc:h2:mem:fastdocdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

# 关闭非必要 Web 表面，缩小启动失败面
fastddd:
  web:
    openapi:
      enabled: false
    knife4j:
      enabled: false
