# W2-1 Worker（非 web）消费者：显式 worker + 目录（目录作业本体属 W3，此处仅装配面）。
fastddd:
  identity:
    enabled: true
    worker: true
    directory:
      enabled: true
    pg:
      initialize-schema: true
      # W21-04：后台 SYSTEM_JOB 业务 @AuditLog 审计贯通（legacy 列模式，默认 actor-columns=false）
      ensure-audit-table: true
  security:
    jwt:
      enabled: false
    local-auth:
      enabled: false
