# W2-1 Worker（非 web）消费者：显式 worker + 目录。
# W3-a 起 directory.enabled=true 为 fail-closed：缺 DirectorySource/DirectoryMirrorStore
# 拒绝启动——W3A-04 起本场景以测试范围端口替身满足端口要求（真实源/存储属 W3-b/W3-c）。
fastddd:
  identity:
    enabled: true
    worker: true
    directory:
      enabled: true
    pg:
      initialize-schema: true
      # W21-04：后台 SYSTEM_JOB 业务 @AuditLog 审计贯通（legacy 列模式，默认 actor-columns=false）
      ensure-audit-table: true
  security:
    jwt:
      enabled: false
    local-auth:
      enabled: false
