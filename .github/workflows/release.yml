name: Central Release

# Maven Central 发布工作流：workflow_dispatch 手动触发（只发最新版，Central 不可逆）。
# 构建自 main（携带最新测试修复），版本由 -Drevision 注入（CI-friendly 版本入口）。
# 发布链路：verify 门禁 → GPG 签名 → Portal 暂存区（autoRelease=false，人工核对后 Publish）。
# 凭证：仓库 secrets（CENTRAL_USERNAME/CENTRAL_PASSWORD/GPG_PRIVATE_KEY/GPG_PASSPHRASE），
# 经 setup-java 注入 settings.xml（server-id=central 与 pom publishingServerId 对应），
# 明文不落仓不落日志。

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Release version, plain X.Y.Z (no -SNAPSHOT suffix)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Guard revision format
        run: |
          if ! [[ "${{ inputs.revision }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::revision must be a plain X.Y.Z release version (no -SNAPSHOT)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21, Central credentials and GPG key
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      # 门禁轮：与既有 CI 同一套 1066 测试全量跑（内网 T8.125 基线逐数对齐口径）。
      # 不带 -Dskip-tests-jar：identity-feishu 的 dogfood TCK 测试源码依赖 core test-jar
      # （W7-d D-7 (A) 形态），必须照常产出方能通过编译；本轮不 deploy，test-jar 不外发。
      - name: Build and verify
        run: ./mvnw -B clean verify -Drevision=${{ inputs.revision }}

      # 发布轮：verify 已绿（同一份源码、同一 revision），测试编译+运行全跳
      # （-Dmaven.test.skip=true 连 test-compile 一起跳过——identity-feishu dogfood
      # 依赖 core test-jar，跳过测试编译即无需该制品）；-Dskip-tests-jar 再保险
      # （profile 双条件：test-jar goal 被 maven.test.skip 跳过 + profile 不激活）；
      # -Pcentral 激活 GPG 签名与 Portal 上传，-P release-artifacts 附带 sources/javadoc，
      # GA 制品形（无 tests.jar）维持；fastddd-consumer-tests 双保险排除
      # （pom 侧已有 maven.deploy.skip=true）。
      - name: Deploy to Central Portal (staging)
        run: >-
          ./mvnw -B deploy
          -Drevision=${{ inputs.revision }}
          -Dmaven.test.skip=true
          -Pcentral,release-artifacts
          -Dskip-tests-jar
          -pl '!fastddd-consumer-tests'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          # setup-java 的 gpg-passphrase 输入只声明环境变量名；真正的口令值
          # 由本步骤导出该变量，Maven 在 settings.xml 的 gpg.passphrase 服务条目
          # 中经 ${env.GPG_PASSPHRASE} 运行时解析——缺此行则 gpg 拿空口令签名失败
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
