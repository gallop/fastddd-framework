# FastDDD Framework Pull Request Validation
# Author: gallop
# Created: 2025-01-10

name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx1024m'

# The PR comment + auto-merge label steps need write access; the private-repo default
# token is read-only, which made actions/github-script fail with 403.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout PR code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Validate Maven project structure
      run: |
        ./mvnw validate -B
        ./mvnw dependency:analyze -B

    # VER-001 版本一致性扫描已移除：原 scripts/verify-version-consistency.py 属拆仓前/
    # Tooling 仓机制，从未迁入本仓（步骤在本仓必红）。守护现状：${revision} 单一版本入口
    # 由根 pom enforcer 与评审守护；BOM 制品清单由 FrameworkBomAllowlistTest 守护。

    - name: Compile and run tests
      run: |
        ./mvnw clean compile -B
        ./mvnw test -B

    # QA-002：该测试不依赖 MySQL、Redis 或消息中间件；必须在每个 PR 中失败即阻断，
    # 以守护 Outbox 多 dispatcher 的 claim、lease 回收和失败重试契约。
    # -am：冷 runner 上单 -pl 无法从仓库解析兄弟 SNAPSHOT 构件，须连同上游模块入 reactor；
    # failIfNoSpecifiedTests=false：上游模块无匹配测试类时不因 -Dtest 过滤而失败。
    - name: Run deterministic Outbox concurrency gate (QA-002)
      run: |
        ./mvnw -B -pl fastddd-framework/fast-ddd-event -am test \
          -Dtest=OutboxDispatcherConcurrencyTest \
          -Dsurefire.failIfNoSpecifiedTests=false
    
    - name: Run code style checks
      run: |
        ./mvnw checkstyle:check -B
      continue-on-error: true
    
    - name: Check for security vulnerabilities
      run: |
        ./mvnw org.owasp:dependency-check-maven:check -B
      continue-on-error: true
    
    - name: Build application
      run: |
        ./mvnw package -DskipTests -B
    
    # Validate Docker build 已移除：仓库不含 Dockerfile（Docker JDK 21 构建模板在消费者侧）。

    - name: Comment PR with results
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('PR Validation Results')
          );
          
          const icon = '${{ job.status }}' === 'success' ? '✅' : '❌';
          const body = `## PR Validation Results

          ${icon} **Build Status**: ${{ job.status }}
          📊 **Tests**: unit suite + deterministic Outbox concurrency gate
          🔍 **Code Quality**: Checkstyle (non-blocking)

          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.head_ref }}`;
          
          if (botComment) {
            github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

  auto-merge-check:
    name: Auto-merge Eligibility Check
    runs-on: ubuntu-latest
    needs: validate-pr
    if: success()
    
    steps:
    - name: Check if PR is eligible for auto-merge
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          
          // Check if PR is from a trusted source (same repo, not fork)
          const isTrusted = !pr.head.repo.fork;
          
          // Check if PR has required labels
          const hasAutoMergeLabel = pr.labels.some(label => label.name === 'auto-merge');
          
          // Check if PR is not a draft
          const isNotDraft = !pr.draft;
          
          if (isTrusted && hasAutoMergeLabel && isNotDraft) {
            console.log('PR is eligible for auto-merge');
            
            // Add auto-merge label if not present
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['ready-to-merge']
            });
          } else {
            console.log('PR is not eligible for auto-merge');
            console.log(`Trusted: ${isTrusted}, Has label: ${hasAutoMergeLabel}, Not draft: ${isNotDraft}`);
          }
