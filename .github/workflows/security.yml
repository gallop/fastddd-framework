name: Security Scan

on:
  schedule:
    # 每天凌晨 2 点运行安全扫描
    - cron: '0 2 * * *'
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository -Xmx1024m'

# Required for CodeQL / SARIF uploads to the Security tab (private repos default to read-only tokens).
permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: OWASP Dependency Check
      # dependency-check >= 12 requires an NVD API key; pass it via the NVD_API_KEY secret
      # once registered (env var is read natively by the plugin). Report-only until then.
      continue-on-error: true
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      run: |
        ./mvnw org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=7 \
          -DretireJsAnalyzerEnabled=false \
          -DnodeAnalyzerEnabled=false \
          -DnuspecAnalyzerEnabled=false \
          -DnugetconfAnalyzerEnabled=false \
          -DcocoapodsAnalyzerEnabled=false \
          -DswiftAnalyzerEnabled=false \
          -DbundleAuditAnalyzerEnabled=false \
          -DpyDistributionAnalyzerEnabled=false \
          -DpyPackageAnalyzerEnabled=false \
          -DrubygemsAnalyzerEnabled=false \
          -DopenSSLAnalyzerEnabled=false \
          -DcmakeAnalyzerEnabled=false \
          -DautoconfAnalyzerEnabled=false \
          -DcomposerAnalyzerEnabled=false \
          -DcpanAnalyzerEnabled=false \
          -DdartAnalyzerEnabled=false \
          -DgolangDepEnabled=false \
          -DgolangModEnabled=false
    
    - name: Upload OWASP Dependency Check results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-check-report
        path: |
          target/dependency-check-report.html
          target/dependency-check-report.xml
          target/dependency-check-report.json
    
    - name: Snyk Security Scan
      uses: snyk/actions/maven@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=medium --all-projects
    
    - name: Upload Snyk results to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      if: always() && env.SNYK_TOKEN
      with:
        sarif_file: snyk.sarif
    
    - name: Trivy vulnerability scanner
      # Report-only: a Spring Boot dependency tree always carries CVEs; suppression
      # policy is a separate decision. exit-code 0 keeps findings non-blocking.
      continue-on-error: true
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        exit-code: '0'
        ignore-unfixed: true

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: 'trivy-results.sarif'

  code-scan:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java
        queries: security-and-quality
    
    - name: Build project for CodeQL
      run: |
        ./mvnw clean compile -DskipTests
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java"
    
    - name: SpotBugs Security Analysis
      run: |
        ./mvnw spotbugs:check \
          -Dspotbugs.effort=Max \
          -Dspotbugs.threshold=Low
    
    - name: Upload SpotBugs results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spotbugs-security-results
        path: |
          target/spotbugsXml.xml
          target/spotbugs.html
    
    - name: PMD Security Analysis
      run: |
        ./mvnw pmd:check \
          -Dpmd.rulesets=category/java/security.xml \
          -Dpmd.failOnViolation=false
    
    - name: Upload PMD results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pmd-security-results
        path: target/pmd.xml

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: TruffleHog OSS
      # Full-history scan (no base/head): on a push to main the checkout IS main,
      # so base=main always equals HEAD and the action refuses to scan.
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --only-verified
    
    - name: GitLeaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}}
    
    - name: Detect hardcoded secrets with Semgrep
      # returntocorp/semgrep-action@v1 is sunset; run semgrep directly.
      # Pattern rules flag test fixtures by design — report-only, not a build gate.
      continue-on-error: true
      run: |
        pip install semgrep
        semgrep scan --config p/secrets --config p/security-audit \
          --sarif --output semgrep.sarif || echo "semgrep reported findings (see uploaded SARIF)"

    - name: Upload Semgrep results to GitHub Advanced Security Dashboard
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('semgrep.sarif') != ''
      with:
        sarif_file: semgrep.sarif

  license-scan:
    name: License Compliance Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    # Note: org.codehaus.mojo:license-maven-plugin has no `check` goal (that is the
    # mycila plugin's goal name) — this repo checks compliance via the generated report.
    - name: Generate License Report
      run: |
        ./mvnw license:aggregate-add-third-party -Dlicense.failIfMissing=false \
          && ./mvnw license:aggregate-third-party-report
    
    - name: Upload License Report
      uses: actions/upload-artifact@v4
      with:
        name: license-report
        path: |
          target/generated-sources/license/THIRD-PARTY.txt
          target/site/aggregate-third-party-report.html
    
    - name: FOSSA License Scan
      if: env.FOSSA_API_KEY
      uses: fossas/fossa-action@main
      with:
        api-key: ${{ secrets.FOSSA_API_KEY }}
        run-tests: true

  # container-scan removed: the repository carries no Dockerfile (the Docker JDK 21
  # setup referenced in CHANGELOG 1.0.0 lives in consumer build templates, not in-tree),
  # so an image build/scan can never run. Reintroduce from git history when a Dockerfile lands.

  infrastructure-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Checkov Infrastructure Security Scan
      # github_actions only: the repository carries no Dockerfiles or Kubernetes/Terraform IaC.
      uses: bridgecrewio/checkov-action@master
      with:
        directory: .
        framework: github_actions
        output_format: sarif
        output_file_path: checkov-results.sarif
        quiet: true
        soft_fail: true
      continue-on-error: true

    - name: Upload Checkov results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('checkov-results.sarif') != ''
      with:
        sarif_file: checkov-results.sarif

  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-scan, secrets-scan, license-scan, infrastructure-scan]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Generate Security Summary
      run: |
        echo "# Security Scan Summary" > security-summary.md
        echo "" >> security-summary.md
        echo "## Scan Results" >> security-summary.md
        echo "" >> security-summary.md
        
        # 检查各个扫描结果
        if [ -d "dependency-check-report" ]; then
          echo "✅ Dependency vulnerability scan completed" >> security-summary.md
        else
          echo "❌ Dependency vulnerability scan failed" >> security-summary.md
        fi
        
        if [ -d "spotbugs-security-results" ]; then
          echo "✅ SpotBugs security analysis completed" >> security-summary.md
        else
          echo "❌ SpotBugs security analysis failed" >> security-summary.md
        fi
        
        if [ -d "license-report" ]; then
          echo "✅ License compliance scan completed" >> security-summary.md
        else
          echo "❌ License compliance scan failed" >> security-summary.md
        fi
        
        echo "" >> security-summary.md
        echo "## Recommendations" >> security-summary.md
        echo "" >> security-summary.md
        echo "1. Review all high and critical severity vulnerabilities" >> security-summary.md
        echo "2. Update dependencies with known security issues" >> security-summary.md
        echo "3. Address any license compliance issues" >> security-summary.md
        echo "4. Review and fix any detected secrets or hardcoded credentials" >> security-summary.md
        echo "" >> security-summary.md
        echo "Generated on: $(date)" >> security-summary.md
    
    - name: Upload Security Summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary
        path: security-summary.md
    
    - name: Comment PR with Security Summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('security-summary.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
    
    - name: Notify security team
      if: failure() && (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#security'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        text: 'Security scan failed for FastDDD Framework. Please review the results.'
