name: Security Scan

on:
  schedule:
    # 每天凌晨 2 点运行安全扫描
    - cron: '0 2 * * *'
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository -Xmx1024m'

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: OWASP Dependency Check
      run: |
        mvn org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=7 \
          -DsuppressionsLocation=.github/dependency-check-suppressions.xml \
          -DretireJsAnalyzerEnabled=false \
          -DnodeAnalyzerEnabled=false \
          -DnuspecAnalyzerEnabled=false \
          -DnugetconfAnalyzerEnabled=false \
          -DcocoapodsAnalyzerEnabled=false \
          -DswiftAnalyzerEnabled=false \
          -DbundleAuditAnalyzerEnabled=false \
          -DpyDistributionAnalyzerEnabled=false \
          -DpyPackageAnalyzerEnabled=false \
          -DrubygemsAnalyzerEnabled=false \
          -DopenSSLAnalyzerEnabled=false \
          -DcmakeAnalyzerEnabled=false \
          -DautoconfAnalyzerEnabled=false \
          -DcomposerAnalyzerEnabled=false \
          -DcpanAnalyzerEnabled=false \
          -DdartAnalyzerEnabled=false \
          -DgolangDepEnabled=false \
          -DgolangModEnabled=false
    
    - name: Upload OWASP Dependency Check results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-check-report
        path: |
          target/dependency-check-report.html
          target/dependency-check-report.xml
          target/dependency-check-report.json
    
    - name: Snyk Security Scan
      uses: snyk/actions/maven@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=medium --all-projects
    
    - name: Upload Snyk results to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      if: always() && env.SNYK_TOKEN
      with:
        sarif_file: snyk.sarif
    
    - name: Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  code-scan:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java
        queries: security-and-quality
    
    - name: Build project for CodeQL
      run: |
        mvn clean compile -DskipTests
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java"
    
    - name: SpotBugs Security Analysis
      run: |
        mvn spotbugs:check \
          -Dspotbugs.effort=Max \
          -Dspotbugs.threshold=Low \
          -Dspotbugs.includeFilterFile=.github/spotbugs-security-include.xml
    
    - name: Upload SpotBugs results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spotbugs-security-results
        path: |
          target/spotbugsXml.xml
          target/spotbugs.html
    
    - name: PMD Security Analysis
      run: |
        mvn pmd:check \
          -Dpmd.rulesets=category/java/security.xml \
          -Dpmd.failOnViolation=false
    
    - name: Upload PMD results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pmd-security-results
        path: target/pmd.xml

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified
    
    - name: GitLeaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}}
    
    - name: Detect hardcoded secrets with Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
          p/java
        generateSarif: "1"
    
    - name: Upload Semgrep results to GitHub Advanced Security Dashboard
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: semgrep.sarif

  license-scan:
    name: License Compliance Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven
    
    - name: License Check with Maven
      run: |
        mvn license:check \
          -Dlicense.failIfMissing=false \
          -Dlicense.failIfUnknown=false
    
    - name: Generate License Report
      run: |
        mvn license:aggregate-third-party-report
    
    - name: Upload License Report
      uses: actions/upload-artifact@v4
      with:
        name: license-report
        path: |
          target/generated-sources/license/THIRD-PARTY.txt
          target/site/aggregate-third-party-report.html
    
    - name: FOSSA License Scan
      if: env.FOSSA_API_KEY
      uses: fossas/fossa-action@main
      with:
        api-key: ${{ secrets.FOSSA_API_KEY }}
        run-tests: true

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image for scanning
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: fastddd/framework:security-scan
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Run Trivy vulnerability scanner on image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'fastddd/framework:security-scan'
        format: 'sarif'
        output: 'trivy-image-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
    
    - name: Upload Trivy image scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-image-results.sarif'
    
    - name: Run Grype vulnerability scanner
      uses: anchore/scan-action@v3
      id: grype
      with:
        image: 'fastddd/framework:security-scan'
        fail-build: false
        severity-cutoff: medium
        output-format: sarif
    
    - name: Upload Grype scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: ${{ steps.grype.outputs.sarif }}
    
    - name: Docker Scout CVEs
      uses: docker/scout-action@v1
      if: env.DOCKER_SCOUT_TOKEN
      with:
        command: cves
        image: 'fastddd/framework:security-scan'
        sarif-file: 'scout-results.sarif'
        summary: true
        token: ${{ secrets.DOCKER_SCOUT_TOKEN }}
    
    - name: Upload Docker Scout results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && env.DOCKER_SCOUT_TOKEN
      with:
        sarif_file: 'scout-results.sarif'

  infrastructure-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Checkov Infrastructure Security Scan
      uses: bridgecrewio/checkov-action@master
      with:
        directory: .
        framework: dockerfile,kubernetes,github_actions
        output_format: sarif
        output_file_path: checkov-results.sarif
        quiet: true
        soft_fail: true
    
    - name: Upload Checkov results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: checkov-results.sarif
    
    - name: Terrascan IaC Security Scan
      uses: tenable/terrascan-action@main
      with:
        iac_type: 'docker'
        iac_version: 'v1'
        policy_type: 'docker'
        only_warn: true
        sarif_upload: true
    
    - name: Hadolint Dockerfile Linting
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        format: sarif
        output-file: hadolint-results.sarif
        no-fail: true
    
    - name: Upload Hadolint results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: hadolint-results.sarif

  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-scan, secrets-scan, license-scan, container-scan, infrastructure-scan]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Generate Security Summary
      run: |
        echo "# Security Scan Summary" > security-summary.md
        echo "" >> security-summary.md
        echo "## Scan Results" >> security-summary.md
        echo "" >> security-summary.md
        
        # 检查各个扫描结果
        if [ -d "dependency-check-report" ]; then
          echo "✅ Dependency vulnerability scan completed" >> security-summary.md
        else
          echo "❌ Dependency vulnerability scan failed" >> security-summary.md
        fi
        
        if [ -d "spotbugs-security-results" ]; then
          echo "✅ SpotBugs security analysis completed" >> security-summary.md
        else
          echo "❌ SpotBugs security analysis failed" >> security-summary.md
        fi
        
        if [ -d "license-report" ]; then
          echo "✅ License compliance scan completed" >> security-summary.md
        else
          echo "❌ License compliance scan failed" >> security-summary.md
        fi
        
        echo "" >> security-summary.md
        echo "## Recommendations" >> security-summary.md
        echo "" >> security-summary.md
        echo "1. Review all high and critical severity vulnerabilities" >> security-summary.md
        echo "2. Update dependencies with known security issues" >> security-summary.md
        echo "3. Address any license compliance issues" >> security-summary.md
        echo "4. Review and fix any detected secrets or hardcoded credentials" >> security-summary.md
        echo "" >> security-summary.md
        echo "Generated on: $(date)" >> security-summary.md
    
    - name: Upload Security Summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary
        path: security-summary.md
    
    - name: Comment PR with Security Summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('security-summary.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
    
    - name: Notify security team
      if: failure() && (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#security'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        text: 'Security scan failed for FastDDD Framework. Please review the results.'