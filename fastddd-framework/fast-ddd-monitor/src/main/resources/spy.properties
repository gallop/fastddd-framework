# P6Spy Configuration for SQL Monitoring
# This file configures P6Spy to intercept SQL queries and enable monitoring

# Module list - specify which modules to load
modulelist=com.p6spy.engine.spy.P6SpyFactory

# Custom message formatting strategy for structured logging
customLogMessageFormat=com.gallop.fastddd.monitor.sql.SqlMonitoringMessageFormatter

# Log file configuration (optional, we'll use logback instead)
logfile=spy.log

# Append to log file
append=true

# Log level for P6Spy
loglevel=info

# Date format for timestamps
dateformat=yyyy-MM-dd HH:mm:ss

# Include category in log messages
includecategories=true

# Exclude categories (empty means include all)
excludecategories=

# Filter configuration
filter=false

# Include/exclude patterns (empty means include all)
include=
exclude=

# Execution time threshold in milliseconds (0 means log all queries)
executionThreshold=0

# Real driver class name (will be auto-detected)
# driverlist=

# Enable/disable SQL statement logging
sqlexpression=true

# Enable/disable prepared statement parameter logging
stacktrace=false

# Enable/disable result set logging
autoflush=true

# Reload properties file interval (in seconds, 0 means no reload)
reloadproperties=false
reloadpropertiesinterval=60

# Use prefix for log messages
useprefix=true

# Log message prefix
prefix=SQL Monitor

# Enable/disable batch statement logging
logMessageFormat=com.gallop.fastddd.monitor.sql.SqlMonitoringMessageFormatter